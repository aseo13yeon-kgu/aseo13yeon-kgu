name: Update Daily Idiom

on:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-idiom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update idiom in README
        run: python3 scripts/update_idiom.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: 오늘의 사자성어 업데이트"
          git push
